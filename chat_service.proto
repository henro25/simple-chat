syntax = "proto3";

package chat;

// ------------------------
// Existing Request/Response messages
// ------------------------

message LiveUpdateRequest {
  string username = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string ip_address = 3;
  int32 port = 4;
}

message LoginResponse {
  int32 errno = 1;
  int32 page_code = 2;
  string client_username = 3;
  repeated UserUnread user_unreads = 4;
}

message UserUnread {
  string username = 1;
  int32 unread_count = 2;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string ip_address = 3;
  int32 port = 4;
}

message SendMessageRequest {
  string sender = 1;
  string recipient = 2;
  string text = 3;
}

message SendMessageResponse {
  int32 errno = 1;
  int32 msg_id = 2;
}

message DeleteMessageRequest {
  int32 msg_id = 1;
}

message DeleteMessageResponse {
  int32 errno = 1;
  string sender = 2;
  int32 msg_id = 3;
  int32 read_status = 4;
}

message AckPushMessageRequest {
  int32 msg_id = 1;
}

message AckPushMessageResponse {
  int32 errno = 1;
}

message ChatHistoryRequest {
  string username = 1;
  string other_user = 2;
  int32 num_msgs = 3;
  int32 oldest_msg_id = 4;
}

message Message {
  string sender = 1;
  int32 msg_id = 2;
  string text = 3;
}

message ChatHistoryResponse {
  int32 errno = 1;
  int32 page_code = 2;
  int32 unread_count = 3;
  repeated Message chat_history = 4;
}

message DeleteAccountRequest {
  string username = 1;
}

message DeleteAccountResponse {
  int32 errno = 1;
}

message PushUser {
  int32 errno = 1;
  string username = 2;
}

message PushMessage {
  int32 errno = 1;
  string sender = 2;
  int32 msg_id = 3;
  string text = 4;
}

message PushDeleteMsg {
  int32 errno = 1;
  int32 msg_id = 2;
  string sender = 3;
  int32 read_status = 4;
}

message PushServerList {
  repeated ServerInfo server_list = 2;
}

message LiveUpdate {
  oneof update {
    PushMessage push_message = 1;
    PushUser push_user = 2;
    PushDeleteMsg push_delete_msg = 3;
    PushServerList push_server_list = 4;
  }
}

// ------------------------
// New messages for replication and server management
// ------------------------

message ServerInfo {
  string ip = 1;
  int32 port = 2;
  bool is_primary = 3;
}

message JoinNetworkRequest {
  string server_ip = 1;
  int32 server_port = 2;
}

message JoinNetworkResponse {
  repeated ServerInfo server_list = 1;
  // Additional state snapshot fields can be added here.
}

message HealthCheckRequest {
}

message HealthCheckResponse {
  string status = 1; // e.g., "OK"
}

message ReplicationRequest {
  string sender = 1;
  string recipient = 2;
  string text = 3;
  string operation = 4; // e.g., "SEND", "DELETE"
}

message ReplicationResponse {
  int32 errno = 1;
}

message UpdateServerListRequest {
  repeated ServerInfo server_list = 1;
}

message UpdateServerListResponse {
  int32 errno = 1;
}

// ------------------------
// Service Definition
// ------------------------

service ChatService {
  rpc Register(RegisterRequest) returns (LoginResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetChatHistory(ChatHistoryRequest) returns (ChatHistoryResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc AckPushMessage(AckPushMessageRequest) returns (AckPushMessageResponse);
  rpc UpdateStream(stream LiveUpdateRequest) returns (stream LiveUpdate);
  rpc JoinNetwork(JoinNetworkRequest) returns (JoinNetworkResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc ReplicateWrite(ReplicationRequest) returns (ReplicationResponse);
  rpc UpdateServerList(UpdateServerListRequest) returns (UpdateServerListResponse);
}
